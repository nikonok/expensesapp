name: Deploy to Server

on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Pass --no-cache to docker compose build (slower, ignores layer cache)"
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # cloudflared access ssh reads TUNNEL_SERVICE_TOKEN_ID / TUNNEL_SERVICE_TOKEN_SECRET
      # (not CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET — those are for backend apps only)
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      # The `secrets` context is NOT available in step `if:` conditionals — referencing
      # it there fails workflow validation ("Unrecognized named-value: 'secrets'"), which
      # aborts the whole run before any job starts. Hoist the gating secrets into env vars
      # here so the steps below can guard on `env.*` (which IS allowed in `if:`).
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      APP_HOSTNAME: ${{ secrets.APP_HOSTNAME }}

    steps:
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Install cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Route SSH connections through the Cloudflare tunnel.
          # Pass service token credentials explicitly via --id/--secret flags so the
          # ProxyCommand works regardless of how cloudflared resolves env vars.
          cat >> ~/.ssh/config << 'EOF'
          Host ${{ secrets.SSH_HOST }}
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            ProxyCommand cloudflared access ssh --hostname %h --id $TUNNEL_SERVICE_TOKEN_ID --secret $TUNNEL_SERVICE_TOKEN_SECRET
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config
          # Write the pre-recorded server host key.
          # ssh-keyscan cannot reach the server (no public IP), so the key is stored
          # in a GitHub Secret and written here instead.
          echo "${{ secrets.SSH_KNOWN_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure Cloudflare tunnel ingress
        if: ${{ env.CF_API_TOKEN != '' }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_TUNNEL_ID: ${{ secrets.CF_TUNNEL_ID }}
          APP_HOSTNAME: ${{ secrets.APP_HOSTNAME }}
          SSH_HOSTNAME: ${{ secrets.SSH_HOST }}
        run: |
          body=$(jq -nc \
            --arg app "$APP_HOSTNAME" --arg ssh "$SSH_HOSTNAME" \
            '{config:{ingress:[
               {hostname:$ssh, service:"ssh://host-gateway:22"},
               {hostname:$app, service:"http://app:80"},
               {service:"http_status:404"}
             ]}}')
          curl --fail-with-body -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/cfd_tunnel/$CF_TUNNEL_ID/configurations" \
            -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" -d "$body"

      - name: Write .env to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          APP_DIR: ${{ secrets.APP_DIR }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          tmp="$(mktemp)"
          {
            printf 'CLOUDFLARE_TUNNEL_TOKEN=%s\n' "$CLOUDFLARE_TUNNEL_TOKEN"
            printf 'BOOTSTRAP_ADMIN_EMAIL=%s\n'   "$BOOTSTRAP_ADMIN_EMAIL"
            printf 'GOOGLE_OAUTH_CLIENT_ID=%s\n'  "$GOOGLE_OAUTH_CLIENT_ID"
            printf 'VAPID_PUBLIC_KEY=%s\n'        "$VAPID_PUBLIC_KEY"
            printf 'VAPID_PRIVATE_KEY=%s\n'       "$VAPID_PRIVATE_KEY"
            printf 'VAPID_SUBJECT=%s\n'           "$VAPID_SUBJECT"
          } > "$tmp"
          base64 -w0 "$tmp" | ssh "$SSH_USER@$SSH_HOST" "
            set -euo pipefail
            umask 077
            remote_tmp=\$(mktemp -p '$APP_DIR' .env.XXXXXX)
            base64 -d > \"\$remote_tmp\"
            chmod 600 \"\$remote_tmp\"
            mv \"\$remote_tmp\" '$APP_DIR/.env'
          "
          shred -u "$tmp"

      - name: Pull, build, and restart
        # docker compose commands use -f with the absolute path to match the
        # sudoers rules on the server (which restrict the deploy user to this
        # specific compose file only). Those rules are `build *` / `up *` — a
        # trailing wildcard that requires at least one argument after the
        # subcommand, so a bare `build` would NOT match and sudo would prompt
        # for a password. Every compose invocation below therefore always
        # carries an argument: the default (cached) path rebuilds via
        # `up -d --build`; the no_cache path runs an explicit `build --no-cache`.
        #
        # This SSH session is tunnelled through the cloudflared container, so
        # recreating cloudflared here would sever our own connection (exit 255).
        # cloudflared depends_on app + api, so a plain `up -d` recreates it as a
        # dependent whenever their images change. We therefore recreate ONLY the
        # app and api services and never recreate a running cloudflared — it only
        # needs restarting on a tunnel-config change, which must be done
        # out-of-band. `up -d --no-recreate cloudflared` still starts it if it
        # happens to be stopped, without disturbing a running tunnel.
        env:
          NO_CACHE: ${{ inputs.no_cache && '--no-cache' || '' }}
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << ENDSSH
            set -euo pipefail
            COMPOSE="sudo docker compose -f ${{ secrets.APP_DIR }}/docker-compose.yml"
            git -C "${{ secrets.APP_DIR }}" pull origin main
            if [ -n "${NO_CACHE}" ]; then
              \$COMPOSE build --no-cache
              \$COMPOSE up -d --no-deps app api
            else
              \$COMPOSE up -d --build --no-deps app api
            fi
            \$COMPOSE up -d --no-recreate cloudflared
            \$COMPOSE ps
          ENDSSH

      - name: Health check
        if: ${{ env.APP_HOSTNAME != '' }}
        run: |
          set -e
          url="https://$APP_HOSTNAME/v1/health"
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "$url" > /dev/null; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Health check attempt $i/6 failed; retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 6 attempts" >&2
          exit 1
