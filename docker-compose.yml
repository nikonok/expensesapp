name: expensesapp

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the Vite bundle at build time. The frontend Google client ID
        # is the same Web OAuth client ID the backend verifies against, and the
        # frontend VAPID key is the same public key — so both reuse the existing
        # server .env values rather than needing separate secrets.
        VITE_GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?GOOGLE_OAUTH_CLIENT_ID must be set}
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    image: expensesapp:local
    container_name: expensesapp-app
    user: "101:101" # nginx uid/gid — explicit here so it cannot be overridden at runtime
    restart: unless-stopped
    # No host port binding — cloudflared reaches the app via Docker DNS (http://app:80).
    expose:
      - "80"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # allows nginx to bind port 80 as non-root
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      # nginx:alpine user uid/gid = 101. tmpfs mounts default to root:root (mode 755),
      # so nginx (non-root) can't write its PID file or logs without explicit ownership.
      - /run:uid=101,gid=101,mode=755 # nginx PID file (/var/run → /run in Alpine)
      - /var/cache/nginx:uid=101,gid=101,mode=755 # nginx proxy/fastcgi cache
      - /var/log/nginx:uid=101,gid=101,mode=755 # logs — volatile, no disk-fill risk
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tunnel
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Cloudflare Tunnel ───────────────────────────────────────────────────────
  # Exposes the app to the internet via an outbound-only tunnel.
  # Cloudflare terminates HTTPS at the edge — this container only speaks HTTP
  # to the app over the internal Docker 'tunnel' network.
  # CLOUDFLARE_TUNNEL_TOKEN is injected from .env (never committed to git).
  cloudflared:
    # Intentionally tracks `latest` — cloudflared is a thin, frequently-updated
    # client and staying current avoids protocol/edge compatibility issues.
    # Pin to a specific tag instead if reproducible deploys are preferred; see
    # releases at: https://github.com/cloudflare/cloudflared/releases
    image: cloudflare/cloudflared:latest
    container_name: expensesapp-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    extra_hosts:
      - "host-gateway:host-gateway" # resolves to the Docker host IP so the tunnel can reach sshd on the host
    networks:
      - tunnel # reaches app via http://app:80; outbound to CF edge via bridge default route
    # NOTE: cloudflared intentionally does NOT depend_on app/api. This tunnel
    # also carries the SSH ingress used for deploys, so it must come up as
    # independent infrastructure — a crash-looping api must never be able to
    # block the tunnel and lock out SSH recovery. If app/api aren't ready yet,
    # their HTTP routes simply return 502 until they become healthy; SSH stays
    # available throughout.

  # ── API backend ────────────────────────────────────────────────────────────
  # Go API service. The app (nginx) container proxies /api/ to api:8080 —
  # see nginx/nginx.conf. See docs/backend/operator-runbook.md for first-boot
  # instructions.
  api:
    build:
      context: backend
      dockerfile: Dockerfile
    image: expensesapp-api:local
    container_name: expensesapp-api
    restart: unless-stopped
    expose:
      - "8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp
    volumes:
      - apidata:/var/lib/expensesapp
    environment:
      DB_PATH: /var/lib/expensesapp/data.db
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL must be set}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?GOOGLE_OAUTH_CLIENT_ID must be set}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY must be set}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY must be set}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?VAPID_SUBJECT must be set}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tunnel

networks:
  tunnel:
    driver: bridge # app ↔ cloudflared; outbound internet allowed for CF edge connection

volumes:
  # SQLite database + snapshots for the Go API backend.
  apidata:
    driver: local
