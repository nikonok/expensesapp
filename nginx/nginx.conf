worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Ensure the PWA manifest gets the correct type WITHOUT a per-location
    # add_header (which would suppress the inherited security headers — see below).
    types {
        application/manifest+json  webmanifest;
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server_tokens off;  # hide nginx version from error pages and headers

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 16k;

    # Real IP extraction — nginx only sees the cloudflared container's Docker IP,
    # not the actual client IP. Cloudflare forwards the real IP in CF-Connecting-IP.
    # We trust the entire Docker bridge range (172.16/12, 192.168/16) since only
    # cloudflared can reach nginx (no public ports). After this, $remote_addr and
    # $binary_remote_addr reflect the real client IP throughout this config.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   CF-Connecting-IP;

    # Rate limiting — secondary defense behind Cloudflare, per real client IP.
    # NOTE: this must be a per-SECOND rate, not per-minute. A single cold SPA
    # load fetches ~40 static chunks (index.html + ~37 hashed /assets/ files +
    # sw.js + manifest + icons) in one burst; a 30r/m limit 429s all but the
    # first few and leaves the app on a black screen. 30r/s with a generous
    # burst absorbs a cold load while still capping abusive hammering.
    limit_req_zone $binary_remote_addr zone=app:10m rate=30r/s;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Per-path Cache-Control, computed here so the security headers below can be
    # applied ONCE at the server level and reach every response.
    #
    # Why this matters: nginx's `add_header` does NOT inherit into a location that
    # defines its own `add_header`. The previous config set Cache-Control via a
    # per-location `add_header` in every location, which silently dropped ALL the
    # server-level security headers (COOP, CSP, HSTS, X-Frame-Options, …) from
    # those responses — so COOP never reached the browser and only the <meta> CSP
    # was doing anything. Driving Cache-Control from this map lets the locations
    # carry no add_header of their own, so the security headers apply everywhere.
    #
    # /assets/ files are content-hashed → safe to cache immutably for a year.
    # /icons/ filenames are not hashed → short cache. Everything else (index.html,
    # sw.js, manifest, SPA routes) must never be cached so PWA updates land.
    map $uri $cache_control {
        default       "no-cache, no-store, must-revalidate";
        ~^/assets/    "public, max-age=31536000, immutable";
        ~^/icons/     "public, max-age=86400";
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        limit_req zone=app burst=100 nodelay;
        limit_req_status 429;

        # ── Security headers — applied to EVERY response ─────────────────────
        # Do NOT add a per-location `add_header` anywhere below: it would suppress
        # inheritance of all of these. Per-path caching is handled by the
        # $cache_control map, not by per-location add_header.
        add_header X-Content-Type-Options       "nosniff"                            always;
        add_header X-Frame-Options              "DENY"                               always;
        add_header X-XSS-Protection             "1; mode=block"                      always;
        add_header Referrer-Policy              "strict-origin-when-cross-origin"    always;
        add_header Permissions-Policy           "geolocation=(), microphone=(), camera=(), payment=()" always;
        # HSTS: 1 year. includeSubDomains omitted until all subdomains serve HTTPS.
        add_header Strict-Transport-Security    "max-age=31536000"                   always;
        # COOP is intentionally unrestricted (unsafe-none). Google Sign-In runs in
        # a popup that hands the credential back via window.postMessage and polls
        # window.closed; ANY COOP isolation — including same-origin-allow-popups —
        # makes Chrome block those cross-window calls and sign-in fails. The crypto
        # worker uses no SharedArrayBuffer, so cross-origin isolation buys nothing
        # here. Clickjacking is still covered by X-Frame-Options: DENY below.
        add_header Cross-Origin-Opener-Policy   "unsafe-none"                        always;
        add_header Cross-Origin-Resource-Policy "same-origin"                        always;
        # CSP: 'wasm-unsafe-eval' is required for libsodium/argon2 (WebAssembly).
        # 'unsafe-inline' in script-src is required by Google Identity Services,
        # which injects inline scripts at runtime. accounts.google.com is allowed
        # in script-src (gsi/client), frame-src (the sign-in iframe), connect-src
        # (token calls), and style-src (injected styles).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://open.er-api.com https://accounts.google.com; frame-src https://accounts.google.com; worker-src 'self'; manifest-src 'self'; form-action 'none'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        # Cache-Control per path (from the map above). NO `always`: an error
        # response (e.g. a 429 from limit_req) must NOT carry immutable caching, or
        # Cloudflare/browsers would cache the error under an asset URL for a year
        # (cache poisoning → app-wide black screen).
        add_header Cache-Control $cache_control;

        # ── API proxy: forward /api/* to the Go backend ─────────────────────
        # The frontend calls /api/v1/… but the Go router serves routes under
        # /v1/… (no /api prefix), so we strip /api/ here. app and api share the
        # compose 'tunnel' network, so 'api' resolves via Docker's embedded DNS
        # (127.0.0.11). resolver + variable proxy_pass so nginx starts even if api
        # isn't up yet and picks up a restarted api's new IP without a reload.
        # No add_header here → inherits the security headers above.
        location /api/ {
            resolver 127.0.0.11 valid=10s;
            set $api_upstream http://api:8080;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            # Encrypted sync batches exceed the tiny global limit (static-app only).
            client_max_body_size 10m;
            # /api/v1/sync/live is Server-Sent Events — stream without buffering.
            proxy_buffering    off;
            proxy_read_timeout 1h;
        }

        # ── Hidden files: deny access ────────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ── Static files + SPA fallback ──────────────────────────────────────
        # try_files serves real files (/assets/*, /icons/*, sw.js, manifest, …)
        # and falls back to index.html (HTTP 200) for client-side routes. No
        # add_header here — caching comes from $cache_control, security headers
        # are inherited from the server block.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
